name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.4
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath .
